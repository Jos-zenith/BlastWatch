<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlastWatch Research</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>BlastWatch</h1>
      <p class="sub">Research data · production context, resistance genes, data pipeline</p>
    </div>
    <nav class="top-nav"><a href="./">← Field officer view</a></nav>
  </header>

  <main>
    <section class="card wide">
      <div class="card-head">
        <h2>Rice production context <span class="muted">· FAOSTAT</span></h2>
        <div class="controls">
          <select id="metric" aria-label="Metric">
            <option value="production_t">Production (Mt)</option>
            <option value="area_ha">Area harvested (Mha)</option>
            <option value="yield_kg_ha">Yield (t/ha)</option>
          </select>
          <select id="from-year" aria-label="From year">
            <option value="1961">Since 1961</option>
            <option value="1990" selected>Since 1990</option>
            <option value="2010">Since 2010</option>
          </select>
        </div>
      </div>
      <div id="areas" class="chips"></div>
      <div class="chart-box tall"><canvas id="prod-chart"></canvas></div>
      <p id="prod-note" class="muted small"></p>
    </section>

    <section class="card wide">
      <div class="card-head"><h2>Resistance genes <span class="muted">· GenBank</span></h2></div>
      <table class="genes">
        <thead><tr><th>Gene</th><th>Organism</th><th>Role</th><th>Description</th><th class="num">GenBank hits</th></tr></thead>
        <tbody id="genes"></tbody>
      </table>
      <div id="gene-records"></div>
    </section>

    <section class="card wide">
      <div class="card-head"><h2>Data pipeline</h2><span id="model" class="muted small"></span></div>
      <table>
        <thead><tr><th>Source</th><th>Last success</th><th>Last failure</th></tr></thead>
        <tbody id="sources"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="research.js"></script>
</body>
</html>
