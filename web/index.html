<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlastWatch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>BlastWatch</h1>
      <p class="sub" data-t="tagline"></p>
    </div>
    <nav class="top-nav">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en">English</button>
        <button data-lang="ta">தமிழ்</button>
      </div>
      <a href="research.html" data-t="research"></a>
    </nav>
  </header>

  <div id="freshness" class="banner" role="status"></div>

  <main>
    <section class="card">
      <div id="summary" class="summary"></div>
      <ul id="actions" class="actions"></ul>
    </section>

    <section class="card detail-card">
      <div id="map"></div>
      <div id="detail" hidden>
        <div class="card-head">
          <h2 id="detail-title"></h2>
          <span id="detail-action" class="badge"></span>
        </div>
        <p id="detail-todo"></p>
        <div id="detail-days" class="day-strip big"></div>
        <p id="detail-basis" class="muted small"></p>
        <div class="chart-box"><canvas id="wet-chart"></canvas></div>

        <h3 data-t="messages"></h3>
        <div id="messages"></div>

        <h3 data-t="seed_advice"></h3>
        <ul id="varieties" class="small"></ul>
      </div>
    </section>
  </main>

  <footer class="muted small" data-t="footer"></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="i18n.js"></script>
  <script src="officer.js"></script>
</body>
</html>
